<title id="title">SpotyBoys: serving and learning</title><desc id="desc">The browser uses nginx to reach Navidrome and the recommendation API. PostgreSQL holds playback events, Redis runtime state. A delta worker exports data for Airflow-triggered GPU retraining. Versioned bundles return to the API through a promotion check.</desc>
